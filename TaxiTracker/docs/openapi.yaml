  /api/v1/vehicles/:
    get:
      operationId: api_v1_vehicles_list
      description: |2

        Возвращает список автомобилей, доступных текущему менеджеру.

        ### Доступ

        Требуется аутентификация.
        Пользователь должен иметь роль менеджера.

        ### Сортировка

        Поддерживается query-параметр `ordering`.

        Допустимые значения:

        - `color`
        - `price`
        - `odometer`

        Для сортировки по убыванию используйте префикс `-`.

        Примеры:

        - `?ordering=color`
        - `?ordering=-price`

        ### Особенности

        Возвращаются только автомобили предприятий, к которым привязан текущий менеджер.
      summary: Получить список автомобилей
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Vehicles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVehiclesList'
          description: ''
    post:
      operationId: api_v1_vehicles_create
      description: |2

        Создает новый автомобиль.

        Поле `enterprise` определяется автоматически по текущему менеджеру.

        При отсутствии прав возвращается `403 Forbidden`.
      summary: Создать автомобиль
      tags:
      - Vehicles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicles'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vehicles'
          multipart/form-data:
